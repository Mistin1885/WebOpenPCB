<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneMind Admin</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <!-- Login View -->
  <div id="login-view">
    <div class="container">
      <div class="login-box">
        <h2>Admin Login</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required autofocus>
          </div>
          <button type="submit" class="btn" style="width: 100%;">Login</button>
          <p id="login-error" class="error" style="display: none;"></p>
        </form>
      </div>
    </div>
  </div>

  <!-- Admin View -->
  <div id="admin-view" class="hidden">
    <header>
      <div class="header-inner">
        <h1>OneMind Admin</h1>
        <button onclick="logout()" class="btn btn-secondary">Logout</button>
      </div>
    </header>

    <div class="container">
      <!-- Tab Navigation -->
      <div class="tabs">
        <button class="tab active" data-tab="feedbacks">Feedbacks</button>
        <button class="tab" data-tab="analytics">Analytics</button>
      </div>

      <!-- Feedbacks Tab -->
      <div id="tab-feedbacks" class="tab-content active">
        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-row">
            <div class="filter-group">
              <label>Type</label>
              <select id="filter-type">
                <option value="">All</option>
                <option value="bug">Bug</option>
                <option value="idea">Idea</option>
                <option value="critique">Critique</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Status</label>
              <select id="filter-status">
                <option value="">All</option>
                <option value="new">New</option>
                <option value="reviewed">Reviewed</option>
                <option value="resolved">Resolved</option>
                <option value="archived">Archived</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Platform</label>
              <select id="filter-platform">
                <option value="">All</option>
              </select>
            </div>
            <div class="filter-group">
              <label>App Version</label>
              <select id="filter-version">
                <option value="">All</option>
              </select>
            </div>
            <div class="filter-group">
              <label>From</label>
              <input type="date" id="filter-date-from">
            </div>
            <div class="filter-group">
              <label>To</label>
              <input type="date" id="filter-date-to">
            </div>
            <div class="filter-group" style="min-width: 200px;">
              <label>Search</label>
              <input type="text" id="filter-search" placeholder="Search messages...">
            </div>
            <div class="filter-actions">
              <button class="btn btn-sm" onclick="applyFilters()">Apply</button>
              <button class="btn btn-sm btn-outline" onclick="clearFilters()">Clear</button>
            </div>
          </div>
        </div>

        <!-- Export bar -->
        <div class="export-bar">
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5f6368;cursor:pointer;">
            <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll()"> Select all
          </label>
          <button class="btn btn-sm btn-outline" onclick="exportFeedbacks('csv')">Export CSV</button>
          <button class="btn btn-sm btn-outline" onclick="exportFeedbacks('json')">Export JSON</button>
        </div>

        <div id="feedback-list">
          <div class="loading">Loading feedbacks...</div>
        </div>

        <div class="pagination hidden" id="pagination">
          <button class="btn btn-secondary btn-sm" id="prev-btn" onclick="changePage(-1)">Previous</button>
          <span class="page-info" id="page-info">Page 1 of 1</span>
          <button class="btn btn-secondary btn-sm" id="next-btn" onclick="changePage(1)">Next</button>
        </div>
      </div>

      <!-- Analytics Tab -->
      <div id="tab-analytics" class="tab-content">
        <div id="analytics-overview" class="stats-grid"></div>
        <div id="analytics-daily" class="analytics-section">
          <h3>Daily Events (Last 30 Days)</h3>
          <div id="daily-chart" class="chart-container"></div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          <div id="analytics-platforms" class="analytics-section">
            <h3>Platforms</h3>
            <div id="platforms-dist"></div>
          </div>
          <div id="analytics-versions" class="analytics-section">
            <h3>App Versions</h3>
            <div id="versions-dist"></div>
          </div>
        </div>
        <div id="analytics-top-events" class="analytics-section">
          <h3>Top Events</h3>
          <div id="top-events-dist"></div>
        </div>
        <div id="analytics-errors" class="analytics-section">
          <h3>Recent Errors</h3>
          <div id="errors-table"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bulk Actions Bar -->
  <div id="bulk-bar" class="bulk-bar">
    <span id="bulk-count">0 selected</span>
    <button class="btn btn-sm" onclick="bulkAction('update_status', 'reviewed')">Mark Reviewed</button>
    <button class="btn btn-sm" onclick="bulkAction('update_status', 'resolved')">Mark Resolved</button>
    <button class="btn btn-sm" onclick="bulkAction('update_status', 'archived')">Archive</button>
    <button class="btn btn-sm btn-danger" onclick="bulkAction('delete')">Delete</button>
  </div>

  <!-- Detail Modal -->
  <div id="modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Feedback Details</h2>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">X</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">Close</button>
        <button class="btn btn-sm" id="modal-save-btn" onclick="saveModalChanges()" style="display:none;">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
