name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Install sidecar dependencies
        run: cd src-ts && bun install --frozen-lockfile

      - name: Compile Bun sidecar
        run: npm run bun:compile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OneMind ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          owner: andrejvysny
          repo: OneMindReleases
          releaseCommitish: main
          args: --target aarch64-apple-darwin

  sync-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download latest.json from release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo andrejvysny/OneMindReleases \
            --pattern "latest.json" \
            --dir .

      - name: Checkout OneMindReleases
        uses: actions/checkout@v4
        with:
          repository: andrejvysny/OneMindReleases
          token: ${{ secrets.RELEASES_PAT }}
          path: releases-repo

      - name: Commit latest.json
        run: |
          cp latest.json releases-repo/latest.json
          cd releases-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "update latest.json for ${{ github.ref_name }}"
          git push
